<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animação Zoom 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }

  #app {
    position:fixed; top:0; left:0;
    width:100%; height:100%;
  }

  #viewport {
    position:absolute; top:50%; left:50%;
    width:800px; height:500px;
    background:#000;
    transform-origin:0 0;
  }

  #blurWrapper {
    position:absolute; top:0; left:0;
    width:800px; height:500px;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
  }
  #blurWrapper.grabbing {
    cursor:grabbing;
  }

  #stage {
    position:absolute; top:0; left:0;
    width:800px; height:500px;
  }

  #imgMapa {
    display:block;
    position:absolute; top:0; left:0;
    will-change:transform;
    backface-visibility:hidden;
  }

  #highlightsSvg {
    position:absolute; top:0; left:0;
    width:800px; height:500px;
    pointer-events:none;
  }

  .letterbox {
    position:absolute;
    background:#000;
    pointer-events:none;
  }
  #lbTop    { top:-10000px; left:-10000px; width:25000px; height:10000px; }
  #lbBot    { top:500px; left:-10000px; width:25000px; height:10000px; }
  #lbLeft   { top:0; left:-10000px; width:10000px; height:500px; }
  #lbRight  { top:0; left:800px; width:10000px; height:500px; }

  .guide {
    position:absolute;
    pointer-events:none;
  }
  #guideTop    { top:0; left:0; width:800px; height:0; border-top:1.5px dashed rgba(255,255,255,0.3); display:none; }
  #guideBot    { top:500px; left:0; width:800px; height:0; border-top:1.5px dashed rgba(255,255,255,0.3); display:none; }
  #guideLeft   { top:0; left:0; width:0; height:500px; border-left:1.5px dashed rgba(255,255,255,0.3); display:none; }
  #guideRight  { top:0; left:800px; width:0; height:500px; border-left:1.5px dashed rgba(255,255,255,0.3); display:none; }

  #statusBar {
    position:absolute; top:0; left:0;
    width:100%; height:42px;
    display:flex; align-items:center; gap:4px;
    padding:4px 6px;
    background:rgba(0,0,0,0.55);
    z-index:10;
    pointer-events:auto;
  }
  #statusBar.marking-mode {
    cursor:ns-resize;
  }
  #statusText {
    flex:1;
    font-family:Arial,sans-serif; font-size:11px; color:#ccc;
    margin-left:220px;
  }
  .marking-hidden { display:none !important; }

  .toolBtn {
    width:40px; height:22px; border-radius:4px; border:1.5px solid;
    font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:#fff; background:#555; border-color:#777;
  }
  #btnUpload  { background:#2196F3; border-color:#1976D2; }
  #btnOpen    { background:#FF9800; border-color:#F57C00; }
  #btnPlay    { background:#4CAF50; border-color:#388E3C; }
  #btnSave    { background:#9C27B0; border-color:#7B1FA2; }
  #btnPen     { background:#555; border-color:#777; }
  #btnEraser  { background:#555; border-color:#777; }
  #btnRecord  { background:#F44336; border-color:#C62828; }
  #btnReset   { background:#555; border-color:#777; }
  .shape-btn.active { background:#4CAF50 !important; border-color:#388E3C !important; color:#fff !important; }

  #timelineSvg {
    position:absolute; top:323px; left:0;
    width:800px; height:90px;
    pointer-events:auto;
    z-index:15;
  }

  #controlsPanel {
    position:absolute; top:390px; left:0;
    width:800px;
    pointer-events:auto;
    z-index:20;
  }
  #controlsPanel .row { display:flex; align-items:center; margin-bottom:3px; gap:4px; }
  #controlsPanel label { white-space:nowrap; cursor:pointer; }
  #controlsPanel label.chk { min-width:52px; }
  #controlsPanel span.lbl { min-width:30px; text-align:center; font-size:10px; color:#aaa; }
  #controlsPanel span.val { min-width:28px; text-align:right; color:#FFD700; font-variant-numeric:tabular-nums; }
  #controlsPanel input[type=range] { width:68px; margin:0 2px; accent-color:#4CAF50; }
  #controlsPanel input[type=checkbox] { accent-color:#4CAF50; margin:0; }
  #controlsPanel button { font-size:11px; padding:2px 8px; background:#555; color:#eee; border:1px solid #777; border-radius:3px; cursor:pointer; }
  #controlsPanel button:hover { background:#4CAF50; }
  #controlsPanel select { background:#444; color:#eee; border:1px solid #666; border-radius:2px; font-size:11px; padding:1px 2px; }

  #controlsInner {
    font-family:Arial,sans-serif; font-size:11px; color:#eee;
    background:rgba(20,20,20,0.85); padding:4px 8px;
    width:800px; user-select:none;
  }

  #modoExibicao { position:absolute; top:4px; right:10px; z-index:11; cursor:pointer; font-family:Arial,sans-serif; font-size:11px; color:#fff; display:flex; align-items:center; gap:4px; }
  #modoExibCheck { display:inline-block; width:14px; height:14px; border-radius:2px; border:1.5px solid rgba(255,255,255,0.6); background:rgba(0,0,0,0.5); text-align:center; font-size:12px; line-height:14px; }

  #penCursor {
    position:absolute; pointer-events:none; display:none;
    width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,0,0.3); border:1px solid rgba(255,255,0,0.5);
    transform:translate(-50%,-50%);
    z-index:9;
  }

  #panelHandle {
    position:absolute; top:308px; left:0; width:800px; height:18px;
    border-radius:3px; background:rgba(255,255,255,0.08);
    border:1.5px dashed rgba(255,255,255,0.3); cursor:grab; z-index:12;
    display:none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="blurWrapper">
      <div id="stage">
        <img id="imgMapa" src="../mapa brasil 1.jpg" draggable="false" style="width:100%;height:100%;object-fit:contain;">
      </div>
    </div>

    <svg id="highlightsSvg" viewBox="0 0 800 500">
      <clipPath id="viewBoxClip"><rect x="0" y="0" width="800" height="500"/></clipPath>
      <g id="highlightsLayer"></g>
    </svg>

    <div id="lbTop" class="letterbox"></div>
    <div id="lbBot" class="letterbox"></div>
    <div id="lbLeft" class="letterbox"></div>
    <div id="lbRight" class="letterbox"></div>
    <div id="guideTop" class="guide"></div>
    <div id="guideBot" class="guide"></div>
    <div id="guideLeft" class="guide"></div>
    <div id="guideRight" class="guide"></div>

    <div id="penCursor"></div>

    <div id="statusBar">
      <button id="btnUpload" class="toolBtn" title="Upload imagem">&#127748;</button>
      <button id="btnOpen" class="toolBtn" title="Abrir projeto">&#128194;</button>
      <button id="btnPlay" class="toolBtn" title="Play/Pause"><span id="playLabel">&#9654;</span></button>
      <button id="btnSave" class="toolBtn" title="Salvar projeto">&#128190;</button>
      <button id="btnPen" class="toolBtn" title="Caneta">&#128395;</button>
      <button id="btnEraser" class="toolBtn" title="Borracha">&#129534;</button>
      <button id="btnLine" class="toolBtn shape-btn" title="Linha reta" style="display:none">&#128207;</button>
      <button id="btnEllipse" class="toolBtn shape-btn" title="Elipse" style="display:none">&#11093;</button>
      <button id="btnRect" class="toolBtn shape-btn" title="Retângulo" style="display:none">&#11036;</button>
      <div id="penRow" class="row" style="display:none">
        <span class="lbl">Esp.</span>
        <input type="range" id="penThickness" min="1" max="20" value="5" step="0.5">
        <span class="val" id="lblPenThickness">5</span>
        <span class="lbl">Cor</span>
        <input type="color" id="penColor" value="#FFFF00" style="width:24px;height:18px;padding:0;border:none;cursor:pointer;">
        <span class="lbl">Opac.</span>
        <input type="range" id="penOpacity" min="5" max="100" value="40" step="5">
        <span class="val" id="lblPenOpacity">0.40</span>
      </div>
      <button id="btnRecord" class="toolBtn" title="Gravar"><span id="recordLabel">&#9679;</span></button>
      <button id="btnReset" class="toolBtn" title="Reset">&#128465;</button>
      <span id="statusText">Pressione ▶ PLAY</span>
    </div>

    <div id="modoExibicao">
      <span id="modoExibCheck"></span>Modo Exibição
    </div>

    <div id="panelHandle"></div>

    <svg id="timelineSvg" viewBox="0 0 800 100">
      <rect x="30" y="45" width="740" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
      <rect id="progressBar" x="40" y="45" width="0" height="6" rx="3" fill="#4CAF50"/>
      <g id="kfContainer"></g>
      <g id="kfLabelContainer"></g>
      <text id="durLabel" x="400" y="65" font-family="Arial,sans-serif" font-size="9" fill="#999" text-anchor="middle">Duração máx: 10s</text>
      <text id="kfInfo" x="400" y="82" font-family="Courier New,monospace" font-size="11" fill="#FFD700" text-anchor="middle"></text>
    </svg>

    <div id="controlsPanel">
      <div id="controlsInner">
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <input type="file" id="projInput" accept=".json" style="display:none">

        <div class="row">
          <label class="chk"><input type="checkbox" id="chkZoom" checked>Zoom</label>
          <span class="lbl">Zoom</span>
          <input type="range" id="zoomSlide" min="0.1" max="10" value="1" step="0.1">
          <input type="number" id="valZoom" value="1.0" step="0.1" min="0.1" style="width:58px;text-align:right;background:#333;color:#FFD700;border:1px solid #555;font-size:11px;">
          <label class="chk"><input type="checkbox" id="chkBlur" checked>Blur</label>
          <span class="lbl">Blur</span>
          <input type="range" id="blurSlide" min="0" max="15" value="7" step="0.5">
          <input type="number" id="valBlur" value="7" step="0.5" min="0" style="width:58px;text-align:right;background:#333;color:#FFD700;border:1px solid #555;font-size:11px;">
        </div>

        <div class="row">
          <label class="chk"><input type="checkbox" id="chkRot" checked>Rot3D</label>
          <span class="lbl">Pitch</span>
          <input type="range" id="pitchSlide" min="-90" max="90" value="-25" step="1">
          <input type="number" id="valPitch" value="-25" step="1" style="width:58px;text-align:right;background:#333;color:#FFD700;border:1px solid #555;font-size:11px;">
          <span class="lbl">Yaw</span>
          <input type="range" id="yawSlide" min="-90" max="90" value="15" step="1">
          <input type="number" id="valYaw" value="15" step="1" style="width:58px;text-align:right;background:#333;color:#FFD700;border:1px solid #555;font-size:11px;">
          <span class="lbl">Roll</span>
          <input type="range" id="rollSlide" min="-90" max="90" value="0" step="1">
          <input type="number" id="valRoll" value="0" step="1" style="width:58px;text-align:right;background:#333;color:#FFD700;border:1px solid #555;font-size:11px;">
        </div>

        <div class="row">
          <label class="chk"><input type="checkbox" id="chkTransl" checked>Trans</label>
          <span class="lbl">Tx</span>
          <input type="number" id="valTx" value="0" step="1" style="width:62px;text-align:right;background:#333;color:#FFD700;border:1px solid #555;font-size:11px;">
          <span class="lbl">Ty</span>
          <input type="number" id="valTy" value="0" step="1" style="width:62px;text-align:right;background:#333;color:#FFD700;border:1px solid #555;font-size:11px;">
          <span style="min-width:8px"></span>
          <span class="lbl">Duração</span>
          <input type="range" id="duracaoSlide" min="1" max="30" value="10" step="1">
          <input type="number" id="valDuracao" value="10" step="1" min="1" style="width:58px;text-align:right;background:#333;color:#FFD700;border:1px solid #555;font-size:11px;">
          <span class="lbl" style="min-width:14px;font-size:10px;color:#aaa;">Res</span>
          <select id="selResolucao">
            <option value="full">Full</option>
            <option value="youtube">YouTube 16:9</option>
            <option value="instagram">Instagram 9:16</option>
          </select>
          <span style="min-width:4px"></span>
          <button id="btnAddKF">+ KF</button>
          <button id="btnDelKF">− KF</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../library/svg-animation-lib.js"></script>
<script>
(function() {
  var H = SVGAnim.Helpers, NS = H.SVG_NS;
  var KF = SVGAnim.Keyframe;
  var IMAGEM = '../mapa brasil 1.jpg';
  var CENTRO_X = 400, CENTRO_Y = 250;
  var IMG_W = 800, IMG_H = 500;
  var T_BAR_X = 40, T_BAR_W = 720;

  function $(id) { return document.getElementById(id); }

  var stage = $('stage'), imagem = $('imgMapa');
  var blurWrapper = $('blurWrapper');
  var statusText = $('statusText');
  var btnPlay = $('btnPlay'), playLabel = $('playLabel');
  var progressBar = $('progressBar');
  var kfInfo = $('kfInfo');
  var kfContainer = $('kfContainer'), kfLabelContainer = $('kfLabelContainer');
  var durLabel = $('durLabel');
  var viewport = $('viewport');

  function configureImageSize(w, h, keepZoom) {
    if (!w || !h) return;
    IMG_W = w; IMG_H = h;
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    imagem.style.width = w + 'px';
    imagem.style.height = h + 'px';
    CENTRO_X = 0;
    CENTRO_Y = 0;
    camera.zoomCenterX = 400;
    camera.zoomCenterY = 250;
    if (!keepZoom && !panelReady) {
      var fitZoom = Math.min(800 / w, 500 / h);
      camera.zoom = fitZoom;
      if ($('zoomSlide')) { $('zoomSlide').value = fitZoom.toFixed(2); $('valZoom').value = fitZoom.toFixed(2); }
      for (var i = 0; i < keyframes.length; i++) {
        keyframes[i].zoom = fitZoom;
        keyframes[i].tx = 0;
        keyframes[i].ty = 0;
      }
      timeline.keyframes = keyframes;
      camera.tx = 0; camera.ty = 0;
      $('valTx').value = 0; $('valTy').value = 0;
    }
    if (!rodando) { loadSlidersFromKeyframe(keyframes[kfIdx]); applyCurrentValues(); }
  }

  var _imgFirstLoad = true;
  imagem.addEventListener('dragstart', function(e) { e.preventDefault(); });
  imagem.addEventListener('load', function() {
    configureImageSize(imagem.naturalWidth, imagem.naturalHeight, !_imgFirstLoad);
    _imgFirstLoad = false;
  });

  var camera = new SVGAnim.Camera({
    zoom: 1.0, blur: 7, blurFilterId: null,
    rotationX: -25, rotationY: 15, rotationZ: 0,
    tx: 0, ty: 0, perspective: 800,
    zoomCenterX: CENTRO_X, zoomCenterY: CENTRO_Y
  });

  var keyframes = [
    new KF({ tempo: 0, zoom: 1.0, blur: 7, rotationX: -25, rotationY: 15 }),
    new KF({ tempo: 5, zoom: 1.5, blur: 0, rotationX: 0, rotationY: 0 })
  ];
  var kfIdx = 0;
  var rodando = false, modoExibicao = false;
  var zoomEnabled = true, blurEnabled = true, rotEnabled = true, translEnabled = true;
  var highlighter = new SVGAnim.Highlighter();
  var canetaAtiva = false;
  var canetaThickness = 5;
  var canetaColor = '#FFFF00';
  var canetaOpacity = 0.4;
  var modoBorracha = false;
  var drawingMode = 'freehand';
  var _shapeStartX = 0, _shapeStartY = 0;
  var marcacaoAtiva = false;
  var cameraSaved = null;
  var restaurando = false;

  var _vpState = null;

  function entrarModoMarcacao() {
    if (marcacaoAtiva) return;
    marcacaoAtiva = true;
    cameraSaved = {
      zoom: camera.zoom, blur: camera.blur,
      rotationX: camera.rotationX, rotationY: camera.rotationY, rotationZ: camera.rotationZ,
      tx: camera.tx, ty: camera.ty, perspective: camera.perspective
    };

    var fitZoom = window.innerWidth / IMG_W;
    camera.zoom = fitZoom;
    camera.blur = 0; camera.tx = 0; camera.ty = 0;
    camera.rotationX = 0; camera.rotationY = 0; camera.rotationZ = 0;

    blurWrapper.style.filter = 'blur(0px)';
    blurWrapper.style.cursor = 'crosshair';
    blurWrapper.classList.remove('grabbing');

    _vpState = {
      transform: viewport.style.transform, width: viewport.style.width, height: viewport.style.height,
      overflow: viewport.style.overflow, marginLeft: viewport.style.marginLeft,
      marginTop: viewport.style.marginTop, top: viewport.style.top, left: viewport.style.left,
      blurPos: blurWrapper.style.position, blurW: blurWrapper.style.width, blurH: blurWrapper.style.height,
      sbParent: $('statusBar').parentNode, sbNext: $('statusBar').nextSibling,
      hlParent: $('highlightsSvg').parentNode, hlNext: $('highlightsSvg').nextSibling
    };

    viewport.style.transform = 'scale(1)';
    viewport.style.width = '100vw';
    viewport.style.height = '100vh';
    viewport.style.overflow = 'scroll';
    viewport.style.marginLeft = '0px';
    viewport.style.marginTop = '0px';
    viewport.style.top = '0';
    viewport.style.left = '0';

    document.body.appendChild($('statusBar'));
    $('statusBar').style.position = 'fixed';
    $('statusBar').style.top = '0';
    $('statusBar').style.left = '0';
    $('statusBar').style.width = '100%';

    blurWrapper.appendChild($('highlightsSvg'));
    $('highlightsSvg').style.position = 'absolute';
    $('highlightsSvg').style.top = '0';
    $('highlightsSvg').style.left = '0';
    $('highlightsSvg').style.pointerEvents = 'none';

    blurWrapper.style.position = 'relative';
    blurWrapper.style.width = (IMG_W * fitZoom) + 'px';
    blurWrapper.style.height = (IMG_H * fitZoom) + 'px';

    $('highlightsSvg').setAttribute('viewBox', '0 0 ' + IMG_W + ' ' + IMG_H);
    $('highlightsSvg').style.width = (IMG_W * fitZoom) + 'px';
    $('highlightsSvg').style.height = (IMG_H * fitZoom) + 'px';
    var clipRect = document.querySelector('#viewBoxClip rect');
    if (clipRect) { clipRect.setAttribute('width', IMG_W); clipRect.setAttribute('height', IMG_H); }

    stage.style.width = (IMG_W * fitZoom) + 'px';
    stage.style.height = (IMG_H * fitZoom) + 'px';
    imagem.style.width = (IMG_W * fitZoom) + 'px';
    imagem.style.height = (IMG_H * fitZoom) + 'px';

    $('controlsPanel').style.display = 'none';
    $('timelineSvg').style.display = 'none';
    $('modoExibicao').style.display = 'none';
    $('panelHandle').style.display = 'none';

    ['btnUpload','btnOpen','btnPlay','btnSave','btnRecord','btnReset','statusText'].forEach(function(id) {
      var el = $(id); if (el) el.classList.add('marking-hidden');
    });
    $('penRow').style.display = 'flex';
    ['btnLine','btnEllipse','btnRect'].forEach(function(id) {
      var el = $(id); if (el) el.style.display = '';
    });
    $('statusBar').classList.add('marking-mode');

    ['lbTop','lbBot','lbLeft','lbRight','guideTop','guideBot','guideLeft','guideRight'].forEach(function(id) {
      var el = $(id); if (el) el.style.display = 'none';
    });

    $('penCursor').style.display = 'block';
    applyTransform();
    updateHighlights(keyframes[kfIdx].tempo);
  }

  function sairModoMarcacao() {
    if (!marcacaoAtiva || !cameraSaved) return;
    marcacaoAtiva = false;

    if (_vpState) {
      viewport.style.transform = _vpState.transform;
      viewport.style.width = _vpState.width;
      viewport.style.height = _vpState.height;
      viewport.style.overflow = _vpState.overflow;
      viewport.style.marginLeft = _vpState.marginLeft;
      viewport.style.marginTop = _vpState.marginTop;
      viewport.style.top = _vpState.top;
      viewport.style.left = _vpState.left;
      blurWrapper.style.position = _vpState.blurPos || 'absolute';
      blurWrapper.style.width = _vpState.blurW || '800px';
      blurWrapper.style.height = _vpState.blurH || '500px';
      if (_vpState.sbParent) {
        if (_vpState.sbNext) {
          _vpState.sbParent.insertBefore($('statusBar'), _vpState.sbNext);
        } else {
          _vpState.sbParent.appendChild($('statusBar'));
        }
      }
      if (_vpState.hlParent) {
        if (_vpState.hlNext) {
          _vpState.hlParent.insertBefore($('highlightsSvg'), _vpState.hlNext);
        } else {
          _vpState.hlParent.appendChild($('highlightsSvg'));
        }
      }
      $('statusBar').style.position = 'absolute';
      $('statusBar').style.top = '0';
      $('statusBar').style.left = '0';
      $('statusBar').style.width = '100%';
      _vpState = null;
    }

    $('highlightsSvg').setAttribute('viewBox', '0 0 800 500');
    $('highlightsSvg').style.width = '800px';
    $('highlightsSvg').style.height = '500px';
    $('highlightsSvg').style.position = 'absolute';
    $('highlightsSvg').style.top = '0';
    $('highlightsSvg').style.left = '0';
    var clipRect = document.querySelector('#viewBoxClip rect');
    if (clipRect) { clipRect.setAttribute('width', 800); clipRect.setAttribute('height', 500); }
    stage.style.width = IMG_W + 'px';
    stage.style.height = IMG_H + 'px';
    imagem.style.width = IMG_W + 'px';
    imagem.style.height = IMG_H + 'px';

    $('controlsPanel').style.display = 'block';
    $('timelineSvg').style.display = 'block';
    $('modoExibicao').style.display = 'flex';
    $('panelHandle').style.display = 'none';

    ['btnUpload','btnOpen','btnPlay','btnSave','btnRecord','btnReset','statusText'].forEach(function(id) {
      var el = $(id); if (el) el.classList.remove('marking-hidden');
    });
    $('penRow').style.display = 'none';
    ['btnLine','btnEllipse','btnRect'].forEach(function(id) {
      var el = $(id); if (el) el.style.display = 'none';
    });
    $('statusBar').classList.remove('marking-mode');

    ['lbTop','lbBot','lbLeft','lbRight','guideTop','guideBot','guideLeft','guideRight'].forEach(function(id) {
      var el = $(id); if (el) el.style.display = '';
    });

    $('penCursor').style.display = 'none';
    blurWrapper.style.cursor = 'grab';

    camera.zoom = cameraSaved.zoom; camera.blur = cameraSaved.blur;
    camera.tx = cameraSaved.tx; camera.ty = cameraSaved.ty;
    camera.rotationX = cameraSaved.rotationX; camera.rotationY = cameraSaved.rotationY; camera.rotationZ = cameraSaved.rotationZ;
    camera.perspective = cameraSaved.perspective;
    cameraSaved = null;

  $('btnRecord').addEventListener('click', function() {
    if (mediaRecorder) { mediaRecorder.stop(); gravando = false; return; }
    var displayMediaOptions = { video: { displaySurface: 'browser' }, audio: false };
    try {
      navigator.mediaDevices.getDisplayMedia(displayMediaOptions).then(function(stream) {
        recordedChunks = [];
        try { mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' }); }
        catch(e) {
          try { mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' }); }
          catch(e2) { mediaRecorder = new MediaRecorder(stream); }
        }
        mediaRecorder.ondataavailable = function(e) { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = function() {
          try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e) {}
          var webmBlob = new Blob(recordedChunks, { type: 'video/webm' });
          function baixarArquivo(blob, nome) {
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = nome;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);
          }
          function finalizar(msg, blob, nome) {
            stream.getTracks().forEach(function(t) { t.stop(); });

            $('recordLabel').innerHTML = '&#9679;';

            statusText.textContent = msg;

          statusText.textContent = 'Convertendo para MP4...';
          var form = new FormData();
          form.append('video', webmBlob, 'video.webm');
          var xhrC = new XMLHttpRequest();
          xhrC.open('POST', '/convert?res=' + resolucao, true);
          xhrC.responseType = 'blob';
          xhrC.timeout = 120000;
          xhrC.onload = function() {
            if (xhrC.status === 200) finalizar('MP4 salvo como animacao.mp4', xhrC.response, 'animacao.mp4');
            else finalizar('Conversão falhou — WebM salvo', webmBlob, 'animacao-gravada.webm');
          };
          xhrC.onerror = function() { finalizar('Servidor offline — WebM salvo', webmBlob, 'animacao-gravada.webm'); };
          xhrC.ontimeout = function() { finalizar('Conversão demorou — WebM salvo', webmBlob, 'animacao-gravada.webm'); };
          xhrC.send(webmBlob);
        };
        mediaRecorder.start();
        gravando = true;
        $('recordLabel').innerHTML = '&#9632;';
        statusText.textContent = 'Gravando...';
        try { document.documentElement.requestFullscreen(); } catch(e) {}
        iniciar();
      }).catch(function(err) { statusText.textContent = 'Gravação cancelada ou não permitida.'; });
    } catch(e) { statusText.textContent = 'Seu navegador não suporta gravação de tela. Use Chrome ou Edge.'; }
  });

  document.addEventListener('change', function(e) {
    if (e.target && e.target.id === 'fileInput') {
      var file = e.target.files[0]; if (!file) return;
      var ext = file.name.split('.').pop() || 'jpg';
      fetch('/upload?ext=' + encodeURIComponent(ext), { method: 'POST', body: file })
        .then(function() {
          imagem.src = '/uploads/image.' + ext;
          statusText.textContent = 'Imagem carregada: ' + file.name;
          salvarEstado();
        })
        .catch(function(err) { statusText.textContent = 'Erro no upload: ' + err.message; });
    }
  });

  document.addEventListener('contextmenu', function(e) {
    if (canetaAtiva) e.preventDefault();
  });

  function clientToViewport(clientX, clientY) {
    var rect = viewport.getBoundingClientRect();
    if (marcacaoAtiva) {
      var fz = camera.zoom;
      return {
        x: (clientX - rect.left + viewport.scrollLeft) / fz,
        y: (clientY - rect.top + viewport.scrollTop) / fz
      };
    }
    return {
      x: (clientX - rect.left) * (800 / rect.width),
      y: (clientY - rect.top) * (500 / rect.height)
    };
  }

  function shapePath(type, x1, y1, x2, y2) {
    if (type === 'line') {
      return 'M' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' L' + x2.toFixed(1) + ',' + y2.toFixed(1);
    }
    if (type === 'rect') {
      return 'M' + x1.toFixed(1) + ',' + y1.toFixed(1) +
             ' L' + x2.toFixed(1) + ',' + y1.toFixed(1) +
             ' L' + x2.toFixed(1) + ',' + y2.toFixed(1) +
             ' L' + x1.toFixed(1) + ',' + y2.toFixed(1) + ' Z';
    }
    if (type === 'ellipse') {
      var cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
      var rx = Math.abs(x2 - x1) / 2, ry = Math.abs(y2 - y1) / 2;
      if (rx < 0.5 || ry < 0.5) return '';
      return 'M' + cx.toFixed(1) + ',' + (cy - ry).toFixed(1) +
             ' A' + rx.toFixed(1) + ',' + ry.toFixed(1) + ' 0 1,0 ' + cx.toFixed(1) + ',' + (cy + ry).toFixed(1) +
             ' A' + rx.toFixed(1) + ',' + ry.toFixed(1) + ' 0 1,0 ' + cx.toFixed(1) + ',' + (cy - ry).toFixed(1) + ' Z';
    }
    return '';
  }

  function setDrawingMode(mode) {
    drawingMode = mode;
    modoBorracha = false;
    $('btnEraser').style.background = '#555';
    $('btnEraser').style.borderColor = '#777';
    $('btnEraser').style.color = '#fff';
    $('btnLine').classList.toggle('active', mode === 'line');
    $('btnEllipse').classList.toggle('active', mode === 'ellipse');
    $('btnRect').classList.toggle('active', mode === 'rect');
  }

  viewport.addEventListener('mousedown', function(e) {
    if (rodando) return;
    if (e.target.closest('#statusBar, #controlsPanel, #timelineSvg, #modoExibicao, #panelHandle')) return;

    var pos = clientToViewport(e.clientX, e.clientY);
    if (canetaAtiva) {
      if (e.button === 2) {
        e.preventDefault();
        arrastando = true; mouseIniX = e.clientX; mouseIniY = e.clientY;
        lerSliders(); txAnchor = keyframes[kfIdx].tx; tyAnchor = keyframes[kfIdx].ty;
        return;
      }
      var maxX = marcacaoAtiva ? IMG_W : 800;
      var maxY = marcacaoAtiva ? IMG_H : 500;
      if (pos.x < 0 || pos.x > maxX || pos.y < 0 || pos.y > maxY) return;
      if (modoBorracha) {
        var marks = highlighter.getMarks(kfIdx);
        var hit = -1, distThreshold = 8;
        for (var mi = marks.length - 1; mi >= 0; mi--) {
          var testP = document.createElementNS(H.SVG_NS, 'path');
          testP.setAttribute('d', marks[mi].path);
          $('highlightsSvg').appendChild(testP);
          var len = testP.getTotalLength();
          for (var li = 0; li < len; li += 6) {
            var pt = testP.getPointAtLength(li);
            var dx = pos.x - pt.x, dy = pos.y - pt.y;
            if (dx * dx + dy * dy < distThreshold * distThreshold) { hit = mi; break; }
          }
          testP.parentNode.removeChild(testP);
          if (hit >= 0) break;
        }
        if (hit >= 0) { marks.splice(hit, 1); applyCurrentValues(); salvarEstado(); }
        return;
      }
      if (drawingMode !== 'freehand') {
        _shapeStartX = pos.x; _shapeStartY = pos.y;
        drawingPath = 'shape';
        var prev = document.getElementById('drawingPreview');
        if (prev) prev.parentNode.removeChild(prev);
        var p = document.createElementNS(H.SVG_NS, 'path');
        p.setAttribute('id', 'drawingPreview');
        p.setAttribute('d', 'M0,0');
        p.setAttribute('stroke', corCanetaRGBA(0.5));
        p.setAttribute('stroke-width', canetaThickness);
        p.setAttribute('fill', 'none');
        p.setAttribute('stroke-linecap', 'round');
        p.setAttribute('stroke-linejoin', 'round');
        $('highlightsLayer').appendChild(p);
        return;
      }
      drawingPath = 'M' + pos.x.toFixed(1) + ',' + pos.y.toFixed(1);
      drawingPoints = [{x: pos.x, y: pos.y}];
      var prev = document.getElementById('drawingPreview');
      if (prev) prev.parentNode.removeChild(prev);
      var p = document.createElementNS(H.SVG_NS, 'path');
      p.setAttribute('id', 'drawingPreview');
      p.setAttribute('d', drawingPath);
      p.setAttribute('stroke', corCanetaRGBA(0.5));
      p.setAttribute('stroke-width', canetaThickness);
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('stroke-linejoin', 'round');
      $('highlightsLayer').appendChild(p);
      return;
    }
    arrastando = true; mouseIniX = e.clientX; mouseIniY = e.clientY;
    lerSliders(); txAnchor = keyframes[kfIdx].tx; tyAnchor = keyframes[kfIdx].ty;
    blurWrapper.classList.add('grabbing');
  });

  window.addEventListener('mousemove', function(e) {
    if (draggingPanel) {
      var dy = e.clientY - panelAnchorY;
      if (marcacaoAtiva) {
        var sb = $('statusBar');
        var newTop = Math.max(0, (parseInt(sb.style.top) || 0) + dy);
        sb.style.top = newTop + 'px';
      } else {
        var cp = $('controlsPanel'), tl = $('timelineSvg'), ph = $('panelHandle');
        if (cp && tl && ph) {
          var cpTop = parseInt(cp.style.top) || 390;
          var newTop = Math.max(10, Math.min(480, cpTop + dy));
          cp.style.top = newTop + 'px';
          tl.style.top = (newTop - 67) + 'px';
          ph.style.top = (newTop - 82) + 'px';
        }
      }
      panelAnchorY = e.clientY;
      return;
    }

    if (canetaAtiva && !rodando) {
      var pos = clientToViewport(e.clientX, e.clientY);
      var pc = $('penCursor');
      if (marcacaoAtiva) {
        var rect = viewport.getBoundingClientRect();
        pc.style.left = (e.clientX - rect.left) + 'px';
        pc.style.top = (e.clientY - rect.top) + 'px';
      } else {
        pc.style.left = pos.x + 'px';
        pc.style.top = pos.y + 'px';
      }
      var maxX = marcacaoAtiva ? IMG_W : 800;
      var maxY = marcacaoAtiva ? IMG_H : 500;
      pc.style.display = (pos.x >= 0 && pos.x <= maxX && pos.y >= 0 && pos.y <= maxY) ? 'block' : 'none';
      if (drawingPath && pos.x >= 0 && pos.x <= maxX && pos.y >= 0 && pos.y <= maxY) {
        if (drawingPath === 'shape') {
          var sp = shapePath(drawingMode, _shapeStartX, _shapeStartY, pos.x, pos.y);
          var dp = document.getElementById('drawingPreview');
          if (dp) dp.setAttribute('d', sp);
        } else {
          drawingPath += ' L' + pos.x.toFixed(1) + ',' + pos.y.toFixed(1);
          drawingPoints.push({x: pos.x, y: pos.y});
          var dp = document.getElementById('drawingPreview');
          if (dp) dp.setAttribute('d', drawingPath);
        }
      }
      return;
    }

    if (draggingKF && !rodando) {
      var rect = viewport.getBoundingClientRect();
      var scale = 800 / rect.width, dx = (e.clientX - dragAnchorX) * scale;
      var raw = dragAnchorTime + (dx / T_BAR_W) * Math.max(keyframes[keyframes.length-1].tempo, timeline.duracao);
      raw = Math.max(0.5, Math.min(timeline.duracao, raw));
      var next = (dragKFIndex + 1 < keyframes.length) ? keyframes[dragKFIndex+1].tempo : timeline.duracao;
      var prev = keyframes[dragKFIndex-1].tempo;
      raw = Math.max(prev + 0.5, Math.min(next - 0.1, raw));
      keyframes[dragKFIndex].tempo = raw;
      moverKeyframeDOM(dragKFIndex, timeline.kfToScreenX(raw));
      var lbl = document.getElementById('kf-lbl-' + dragKFIndex); if (lbl) lbl.textContent = raw.toFixed(1) + 's';
      applyCurrentValues(); return;
    }

    if (!arrastando || rodando) return;
    var dx = e.clientX - mouseIniX, dy = e.clientY - mouseIniY;
    var ntx = Math.round(txAnchor + dx);
    var nty = Math.round(tyAnchor + dy);
    keyframes[kfIdx].tx = ntx; keyframes[kfIdx].ty = nty;
    $('valTx').value = ntx; $('valTy').value = nty;
    atualizarSliderLabels(); applyCurrentValues(); salvarEstado();
  });

  window.addEventListener('mouseup', function(e) {
    blurWrapper.classList.remove('grabbing');
    if (draggingPanel) { draggingPanel = false; return; }
    if (drawingPath) {
      var dp = document.getElementById('drawingPreview');
      if (drawingPath === 'shape') {
        if (dp) {
          var shapeD = dp.getAttribute('d');
          if (shapeD && shapeD !== 'M0,0') {
            var totalL = dp.getTotalLength() || 100;
            highlighter.addMark(kfIdx, shapeD, canetaThickness, totalL, corCanetaRGBA());
          }
        }
      } else {
        var totalL = dp ? dp.getTotalLength() : drawingPath.length * 2;
        highlighter.addMark(kfIdx, drawingPath, canetaThickness, totalL, corCanetaRGBA());
      }
      drawingPath = ''; drawingPoints = [];
      if (dp) dp.parentNode.removeChild(dp);
      $('penCursor').style.display = 'none';
      applyCurrentValues();
      salvarEstado();
      return;
    }
    arrastando = false;
    if (draggingKF) { draggingKF = false; dragKFIndex = -1; selecionarKF(kfIdx); salvarEstado(); }
  });

  viewport.addEventListener('wheel', function(e) {
    if (rodando || !e.ctrlKey) return; e.preventDefault();
    var d = e.deltaY < 0 ? 1 : -1;
    keyframes[kfIdx].zoom = Math.max(0.1, keyframes[kfIdx].zoom + d * 0.1);
    $('zoomSlide').value = keyframes[kfIdx].zoom;
    atualizarSliderLabels(); applyCurrentValues(); salvarEstado();
  }, { passive: false });

  function applyTransform() {
    if (marcacaoAtiva) {
      stage.style.transform = '';
      imagem.style.transform = '';
      $('highlightsLayer').style.transform = '';
      return;
    }
    var baseP = Math.max(IMG_W, IMG_H) * 1.6;
    var P = Math.max(100, baseP - Math.abs(camera.rotationX) / 90 * baseP * 0.75);
    var hw = IMG_W / 2, hh = IMG_H / 2;

    stage.style.transform =
      'translate(400px,250px) ' +
      'rotate(' + camera.rotationZ.toFixed(2) + 'deg) ' +
      'scale(' + camera.zoom + ') ' +
      'translate(' + camera.tx.toFixed(2) + 'px,' + camera.ty.toFixed(2) + 'px) ' +
      'translate(' + (-hw).toFixed(2) + 'px,' + (-hh).toFixed(2) + 'px)';
    stage.style.transformOrigin = '0 0';

    imagem.style.transform =
      'perspective(' + P + 'px) ' +
      'rotateX(' + camera.rotationX.toFixed(2) + 'deg) ' +
      'rotateY(' + camera.rotationY.toFixed(2) + 'deg)';
    imagem.style.transformOrigin = hw + 'px ' + hh + 'px';

    var hl = $('highlightsLayer');
    hl.style.transform =
      'translate(400px,250px) ' +
      'rotate(' + camera.rotationZ.toFixed(2) + 'deg) ' +
      'scale(' + camera.zoom + ') ' +
      'translate(' + camera.tx.toFixed(2) + 'px,' + camera.ty.toFixed(2) + 'px) ' +
      'translate(' + (-hw).toFixed(2) + 'px,' + (-hh).toFixed(2) + 'px)';
    hl.style.transformOrigin = '0 0';
  }

  function salvarEstado() {
    if (restaurando) return;
    try {
      var state = { imagem: imagem.src, modoExibicao: modoExibicao, resolucao: resolucao, duracao: timeline.duracao,
        zoomEnabled: zoomEnabled, blurEnabled: blurEnabled, rotEnabled: rotEnabled, translEnabled: translEnabled, kfs: [],
        highlights: highlighter.toJSON() };
      for (var i = 0; i < keyframes.length; i++) {
        var k = keyframes[i];
        state.kfs.push({ tempo: k.tempo, zoom: k.zoom, blur: k.blur, rotationX: k.rotationX, rotationY: k.rotationY,
          rotationZ: k.rotationZ, tx: k.tx, ty: k.ty, perspective: k.perspective });
      }
      fetch('/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) })
        .catch(function(e) { statusText.textContent = 'Erro ao salvar: ' + e.message; });
    } catch(e) { statusText.textContent = 'Erro ao salvar: ' + e.message; }
  }

  function aplicarEstado(st) {
    if (!st) return;
    try {
      if (st.imagem) { imagem.src = st.imagem; }
      if (st.modoExibicao !== undefined) { modoExibicao = st.modoExibicao; $('modoExibCheck').textContent = modoExibicao ? '\u2713' : ''; }
      if (st.duracao !== undefined) { timeline.duracao = st.duracao; $('duracaoSlide').value = timeline.duracao; }
      if (st.resolucao !== undefined) { resolucao = st.resolucao; $('selResolucao').value = resolucao; }
      if (st.highlights !== undefined) highlighter.fromJSON(st.highlights);
      if (st.zoomEnabled !== undefined) zoomEnabled = st.zoomEnabled;
      if (st.blurEnabled !== undefined) blurEnabled = st.blurEnabled;
      if (st.rotEnabled !== undefined) rotEnabled = st.rotEnabled;
      if (st.translEnabled !== undefined) translEnabled = st.translEnabled;
      if (st.kfs && st.kfs.length >= 2) {
        keyframes.length = 0;
        for (var i = 0; i < st.kfs.length; i++) keyframes.push(new KF(st.kfs[i]));
        timeline.keyframes = keyframes;
      }
    } catch(e) { statusText.textContent = 'Erro ao carregar estado: ' + e.message; }
  }

  function reposicionarTodosDots() {
    for (var j = 0; j < keyframes.length; j++) {
      moverKeyframeDOM(j, timeline.kfToScreenX(keyframes[j].tempo));
      var lbl = document.getElementById('kf-lbl-' + j); if (lbl) lbl.textContent = (j===0 ? '0.0s' : keyframes[j].tempo.toFixed(1) + 's');
    }
  }

  function setupSliderListeners() {
    var sls = document.querySelectorAll('#controlsPanel input[type=range], #controlsPanel input[type=checkbox]');
    for (var i = 0; i < sls.length; i++) {
      sls[i].addEventListener('input', function() { lerSliders(); atualizarSliderLabels(); updateKeyframeSelection(); reposicionarTodosDots(); salvarEstado(); });
    }
    var nums = document.querySelectorAll('#valZoom,#valBlur,#valPitch,#valYaw,#valRoll,#valTx,#valTy,#valDuracao');
    for (var j = 0; j < nums.length; j++) {
      nums[j].addEventListener('input', function() {
        var idMap = { valZoom:'zoomSlide', valBlur:'blurSlide', valPitch:'pitchSlide', valYaw:'yawSlide', valRoll:'rollSlide', valDuracao:'duracaoSlide' };
        var sliderId = idMap[this.id];
        if (sliderId) { var s = $(sliderId); if (s) s.value = this.value; }
        lerSliders(); atualizarSliderLabels(); updateKeyframeSelection(); reposicionarTodosDots(); salvarEstado();
      });
    }
    $('btnAddKF').addEventListener('click', addKeyframe);
    $('btnDelKF').addEventListener('click', removeKeyframe);

  $('panelHandle').addEventListener('mousedown', function(e) {
    e.preventDefault(); e.stopPropagation();
    draggingPanel = true;
    panelAnchorY = e.clientY;
  });

  $('statusBar').addEventListener('mousedown', function(e) {
    if (!marcacaoAtiva) return;
    if (e.target.closest('button, input, label')) return;
    e.preventDefault();
    draggingPanel = true;
    panelAnchorY = e.clientY;
  });

    $('btnPen').addEventListener('click', function() {
      canetaAtiva = !canetaAtiva;
      modoBorracha = false;
      var er = $('btnEraser');
      er.style.background = '#555';
      er.style.borderColor = '#777';
      if (canetaAtiva) {
        $('btnPen').style.background = '#4CAF50';
        $('btnPen').style.borderColor = '#388E3C';
        $('btnPen').style.color = '#fff';
        setDrawingMode('freehand');
        entrarModoMarcacao();
        atualizarPenCursorColor();
      } else {
        $('btnPen').style.background = '#555';
        $('btnPen').style.borderColor = '#777';
        $('btnPen').style.color = '#ccc';
        sairModoMarcacao();
      }
      atualizarPenCursorColor();
    });

    $('penThickness').addEventListener('input', function() {
      canetaThickness = parseFloat(this.value);
      $('lblPenThickness').textContent = canetaThickness;
      $('penCursor').style.width = (canetaThickness) + 'px';
      $('penCursor').style.height = (canetaThickness) + 'px';
    });

    $('penColor').addEventListener('input', function() {
      canetaColor = this.value;
      atualizarPenCursorColor();
    });

    $('penOpacity').addEventListener('input', function() {
      canetaOpacity = parseInt(this.value) / 100;
      $('lblPenOpacity').textContent = canetaOpacity.toFixed(2);
      atualizarPenCursorColor();
    });

    $('btnEraser').addEventListener('click', function() {
      if (!canetaAtiva) { $('btnPen').dispatchEvent(new Event('click')); }
      modoBorracha = !modoBorracha;
      var er = $('btnEraser');
      if (modoBorracha) {
        er.style.background = '#F44336';
        er.style.borderColor = '#C62828';
        er.style.color = '#fff';
      } else {
        er.style.background = '#555';
        er.style.borderColor = '#777';
        er.style.color = '#fff';
      }
      atualizarPenCursorColor();
    });

    $('btnLine').addEventListener('click', function() { setDrawingMode('line'); });
    $('btnEllipse').addEventListener('click', function() { setDrawingMode('ellipse'); });
    $('btnRect').addEventListener('click', function() { setDrawingMode('rect'); });

    $('selResolucao').addEventListener('change', function() {
      resolucao = this.value;
      aplicarLetterbox();
      salvarEstado();
    });
  }

  var drawingPath = '', drawingPoints = [];

  var panelReady = false;
  function initQuandoPronto() {
    if (panelReady) return; if (!$('zoomSlide')) return;
    panelReady = true;
    restaurando = true;
    fetch('/state')
      .then(function(r) { return r.json(); })
      .then(function(st) { if (st) aplicarEstado(st); })
      .catch(function() {})
      .then(function() {
        setupSliderListeners();
        $('chkZoom').checked = zoomEnabled; $('chkBlur').checked = blurEnabled;
        $('chkRot').checked = rotEnabled; $('chkTransl').checked = translEnabled;
        loadSlidersFromKeyframe(keyframes[0]);
        reconstruirTodosKeyframesDOM();
        kfIdx = 0;
        updateKeyframeSelection(); applyCurrentValues();
        aplicarLetterbox();
        restaurando = false;

        $('modoExibicao').addEventListener('click', function() {
          modoExibicao = !modoExibicao;
          $('modoExibCheck').textContent = modoExibicao ? '\u2713' : '';
          salvarEstado();
        });
      });
  }

  function updateViewportScale() {
    var s = Math.min(window.innerWidth / 800, window.innerHeight / 550);
    viewport.style.transform = 'scale(' + s + ')';
    viewport.style.marginLeft = Math.round((window.innerWidth - 800 * s) / 2) + 'px';
    viewport.style.marginTop = Math.round((window.innerHeight - 500 * s) / 2) + 'px';
    viewport.style.top = '0';
    viewport.style.left = '0';
  }
  window.addEventListener('resize', updateViewportScale);
  updateViewportScale();

  document.addEventListener('keydown', function(e) {
    var a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
    if (e.code === 'Home') { e.preventDefault(); if (!rodando) selecionarKF(0); }
    if (e.code === 'End') { e.preventDefault(); if (!rodando) selecionarKF(keyframes.length - 1); }
    if (e.code === 'ArrowLeft') { e.preventDefault(); if (!rodando) { if (kfIdx > 0) selecionarKF(kfIdx - 1); } }
    if (e.code === 'ArrowRight') { e.preventDefault(); if (!rodando) { if (kfIdx < keyframes.length - 1) selecionarKF(kfIdx + 1); } }
    if (e.code === 'Space') { e.preventDefault(); iniciar(); }
    if (e.code === 'Tab') { e.preventDefault(); if (marcacaoAtiva && !modoBorracha) toggleCamadas(); }
    if (e.code === 'Escape') { e.preventDefault(); if (marcacaoAtiva) { canetaAtiva = false; sairModoMarcacao(); } }
    if (e.code === 'KeyC') { e.preventDefault(); if (!rodando) $('btnPen').click(); }
  });

  applyTransform();
  updateStatus();

  setTimeout(initQuandoPronto, 200);
  var poll = setInterval(function() { if (!panelReady) initQuandoPronto(); else clearInterval(poll); }, 100);
})();
</script>
